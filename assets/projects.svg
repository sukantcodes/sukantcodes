<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 356" width="100%"><style>.ti{font:800 20px "Segoe UI",system-ui,sans-serif;fill:#fff4e6}.st{font:600 12.5px ui-monospace,Menlo,monospace}.de{font:500 13.5px "Segoe UI",system-ui,sans-serif;fill:#d8cff5}.ic{font:900 24px "Segoe UI",sans-serif}.sb{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1px}
