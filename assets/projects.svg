.c0{animation:fl 8s cubic-bezier(.45,0,.55,1) infinite}.c1{animation:fl 8s cubic-bezier(.45,0,.55,1) infinite 1s}.c2{animation:fl 8s cubic-bezier(.45,0,.55,1) infinite 2s}.c3{animation:fl 8s cubic-bezier(.45,0,.55,1) infinite 3s}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
