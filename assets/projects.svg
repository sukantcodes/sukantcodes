<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 356" width="100%">
<style>.ti{font:800 20px "Segoe UI",system-ui,sans-serif;fill:#fff}.st{font:600 12.5px ui-monospace,Menlo,monospace}.de{font:500 13.5px "Segoe UI",system-ui,sans-serif;fill:#d8cff5}.ic{font:900 24px "Segoe UI",sans-serif}.sb{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.c0{animation:fl 5s ease-in-out infinite}.c1{animation:fl 5s ease-in-out infinite .8s}.c2{animation:fl 5s ease-in-out infinite 1.6s}.c3{animation:fl 5s ease-in-out infinite 2.4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><filter id="cg" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="sh0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ff3" stop-opacity=".18"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<linearGradient id="sh1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".18"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></linearGradient></defs>
<g transform="translate(20,20)" class="c0"><g filter="url(#cg)"><rect width="430" height="148" rx="22" fill="#12062b" stroke="#ff9ff3" stroke-width="2.2"/></g>
<rect width="430" height="148" rx="22" fill="url(#sh0)" opacity=".55"/>
<rect x="22" y="24" width="46" height="46" rx="14" fill="#ff9ff3" opacity=".18" stroke="#ff9ff3" stroke-width="1.5"/>
<text x="45" y="55" text-anchor="middle" class="ic" fill="#ff9ff3">J</text>
<text x="84" y="44" class="ti">The Ultimate JARVIS</text><text x="84" y="64" class="st" fill="#ff9ff3">Kotlin · Gemini AI · Android SDK</text>
<text x="24" y="100" class="de">Autonomous AI voice assistant with fast speech</text><text x="24" y="120" class="de">recognition and device automation.</text>
<circle cx="350" cy="30" r="5" fill="#5eead4"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="362" y="35" class="sb" fill="#5eead4">DEPLOYED</text></g><g transform="translate(470,20)" class="c1"><g filter="url(#cg)"><rect width="430" height="148" rx="22" fill="#12062b" stroke="#7dd3fc" stroke-width="2.2"/></g>
<rect width="430" height="148" rx="22" fill="url(#sh1)" opacity=".55"/>
<rect x="22" y="24" width="46" height="46" rx="14" fill="#7dd3fc" opacity=".18" stroke="#7dd3fc" stroke-width="1.5"/>
<text x="45" y="55" text-anchor="middle" class="ic" fill="#7dd3fc">M</text>
<text x="84" y="44" class="ti">MovieBox</text><text x="84" y="64" class="st" fill="#7dd3fc">Jetpack Compose · ExoPlayer · Room</text>
<text x="24" y="100" class="de">Fluid video streaming app with declarative UI,</text><text x="24" y="120" class="de">chunk caching and reactive architecture.</text>
<circle cx="350" cy="30" r="5" fill="#5eead4"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="362" y="35" class="sb" fill="#5eead4">DEPLOYED</text></g><g transform="translate(20,188)" class="c2"><g filter="url(#cg)"><rect width="430" height="148" rx="22" fill="#12062b" stroke="#c4b5fd" stroke-width="2.2"/></g>
<rect width="430" height="148" rx="22" fill="url(#sh0)" opacity=".55"/>
<rect x="22" y="24" width="46" height="46" rx="14" fill="#c4b5fd" opacity=".18" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="45" y="55" text-anchor="middle" class="ic" fill="#c4b5fd">M</text>
<text x="84" y="44" class="ti">My Voice Assistant</text><text x="84" y="64" class="st" fill="#c4b5fd">Kotlin · Android</text>
<text x="24" y="100" class="de">Voice-first assistant app built natively</text><text x="24" y="120" class="de">for Android devices.</text>
<circle cx="350" cy="30" r="5" fill="#5eead4"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="362" y="35" class="sb" fill="#5eead4">SHIPPED</text></g><g transform="translate(470,188)" class="c3"><g filter="url(#cg)"><rect width="430" height="148" rx="22" fill="#12062b" stroke="#fdba74" stroke-width="2.2"/></g>
<rect width="430" height="148" rx="22" fill="url(#sh1)" opacity=".55"/>
<rect x="22" y="24" width="46" height="46" rx="14" fill="#fdba74" opacity=".18" stroke="#fdba74" stroke-width="1.5"/>
<text x="45" y="55" text-anchor="middle" class="ic" fill="#fdba74">A</text>
<text x="84" y="44" class="ti">AI Systems Core</text><text x="84" y="64" class="st" fill="#fdba74">Python · FastAPI · PyTorch</text>
<text x="24" y="100" class="de">Neural model pipelines, voice agent integrations</text><text x="24" y="120" class="de">and developer toolkits.</text>
<circle cx="350" cy="30" r="5" fill="#fdba74"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="362" y="35" class="sb" fill="#fdba74">ACTIVE</text></g></svg>