@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
.sway{animation:sway 11s cubic-bezier(.45,0,.55,1) infinite}
@keyframes bokeh{from{transform:translateY(0)}to{transform:translateY(-600px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes blink{50%{opacity:0}}
.b1{animation:bob 8s cubic-bezier(.45,0,.55,1) infinite}.b2{animation:bob 7s cubic-bezier(.45,0,.55,1) infinite .9s}.b3{animation:bob 9s cubic-bezier(.45,0,.55,1) infinite 1.8s}.b4{animation:bob 7.5s cubic-bezier(.45,0,.55,1) infinite 2.7s}
.pulse{animation:pulse 6s cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
