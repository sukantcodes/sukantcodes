<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 170" width="100%"><style>
.h3{font-family:"Arial Black","Segoe UI",Inter,system-ui,sans-serif;font-weight:900}
.hd{font-family:"Segoe UI",Inter,system-ui,sans-serif;font-weight:800}
.mono{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
.tw1{animation:tw 4.6s cubic-bezier(.45,0,.55,1) infinite}.tw2{animation:tw 6.2s cubic-bezier(.45,0,.55,1) infinite -1.7s}.tw3{animation:tw 3.8s cubic-bezier(.45,0,.55,1) infinite -.9s}.tw4{animation:tw 7.4s cubic-bezier(.45,0,.55,1) infinite -3.2s}
@keyframes sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
.sway{animation:sway 11s cubic-bezier(.45,0,.55,1) infinite}
@keyframes bokeh{from{transform:translateY(0)}to{transform:translateY(-600px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes blink{50%{opacity:0}}
.b1{animation:bob 8s cubic-bezier(.45,0,.55,1) infinite}.b2{animation:bob 7s cubic-bezier(.45,0,.55,1) infinite .9s}.b3{animation:bob 9s cubic-bezier(.45,0,.55,1) infinite 1.8s}.b4{animation:bob 7.5s cubic-bezier(.45,0,.55,1) infinite 2.7s}
.pulse{animation:pulse 6s cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
