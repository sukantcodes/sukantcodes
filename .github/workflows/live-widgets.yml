name: Live Widgets
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-widgets.yml"
      - ".github/scripts/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Arcade contribution games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,tetris"

      - name: Snake (premium colours)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f5d28a&color_dots=#110a24,#4a3a1a,#8a6a2b,#c99a45,#f5d28a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f5d28a

      - name: Live stats card
        run: python3 .github/scripts/gen_stats.py dist/live-stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Dark backing for transparent widgets
        run: |
          python3 - <<'PY'
          import glob, re
          for f in glob.glob('dist/*.svg'):
              if f.endswith('live-stats.svg'): continue
              s = open(f, encoding='utf8').read()
              s = re.sub(r'(<svg[^>]*>)', r'\1<rect x="-9999" y="-9999" width="29999" height="29999" fill="#06050e"/>', s, count=1)
              open(f, 'w', encoding='utf8').write(s)
          PY

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
